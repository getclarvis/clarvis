name: candidate runtime

on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_REPOSITORY: ghcr.io/getclarvis/clarvis-runtime-candidate-artifact
  IMAGE_REPOSITORY: ghcr.io/getclarvis/clarvis-runtime-candidate

jobs:
  images:
    name: qualify candidate ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: validate candidate identity
        run: bun run tooling/release/candidate.ts validate
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - run: bun run build
      - name: install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: authenticate source-owned candidate registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: build carrier and qualify runnable candidate with both engines
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          artifact_tag="$ARTIFACT_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"
          image_tag="$IMAGE_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE"
          bun run runtime:build -- --artifact-only "$artifact_tag"
          docker push "$artifact_tag"
          artifact_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$artifact_tag")"
          [[ "$artifact_ref" == "$ARTIFACT_REPOSITORY@sha256:"* ]]
          bun run runtime:build -- --candidate "$artifact_ref" "$image_tag"
          bash tooling/ci/qualify-runtime.sh "$image_tag" docker
          docker save "$image_tag" | podman load
          bash tooling/ci/qualify-runtime.sh "$image_tag" podman
          docker push "$image_tag"
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")"
          [[ "$image_ref" == "$IMAGE_REPOSITORY@sha256:"* ]]
          mkdir -p build/candidate
          printf 'ARTIFACT_REF=%s\nRUNTIME_REF=%s\n' "$artifact_ref" "$image_ref" > "build/candidate/$ARCHITECTURE.refs"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.architecture }}
          path: build/candidate/*.refs
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish qualified candidate in source repository
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-*
          path: build/candidate
          merge-multiple: true
      - name: authenticate candidate registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: assemble candidate indexes and identity
        id: images
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifact_refs < <(sed -n 's/^ARTIFACT_REF=//p' build/candidate/*.refs | LC_ALL=C sort)
          mapfile -t runtime_refs < <(sed -n 's/^RUNTIME_REF=//p' build/candidate/*.refs | LC_ALL=C sort)
          test "${#artifact_refs[@]}" -eq 2
          test "${#runtime_refs[@]}" -eq 2
          for repository in "$ARTIFACT_REPOSITORY" "$IMAGE_REPOSITORY"; do
            if docker buildx imagetools inspect "$repository:$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo 'Candidate index already exists; refusing to overwrite it.' >&2
              exit 1
            fi
          done
          docker buildx imagetools create --tag "$ARTIFACT_REPOSITORY:$GITHUB_REF_NAME" "${artifact_refs[@]}"
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$GITHUB_REF_NAME" "${runtime_refs[@]}"
          artifact_digest="$(docker buildx imagetools inspect "$ARTIFACT_REPOSITORY:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')"
          runtime_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')"
          printf 'artifact=%s\nruntime=%s\n' "$artifact_digest" "$runtime_digest" >> "$GITHUB_OUTPUT"
          ARTIFACT_DIGEST="$artifact_digest" RUNTIME_DIGEST="$runtime_digest" bun run tooling/release/candidate.ts manifest
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.ARTIFACT_REPOSITORY }}
          subject-digest: ${{ steps.images.outputs.artifact }}
          push-to-registry: true
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.images.outputs.runtime }}
          push-to-registry: true
      - name: publish source prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run tooling/release/candidate.ts publish
