name: candidate runtime

on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_REPOSITORY: ghcr.io/getclarvis/clarvis-runtime-base

jobs:
  runtime:
    name: build and qualify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run tooling/release/candidate.ts validate
      - run: bun run check:release
      - run: bun run build
      - run: docker version && podman version
      - name: build immutable base and Kernel artifact
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "build/candidate/${{ matrix.target }}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          local_base="clarvis-base:candidate-${{ matrix.target }}"
          bun run runtime:base:build --engine docker --target "${{ matrix.target }}" --tag "$local_base"
          base_revision="$(docker image inspect --format '{{index .Config.Labels "io.clarvis.base.revision"}}' "$local_base")"
          published_base="$BASE_REPOSITORY:clarvis-linux-glibc-v1-$base_revision-${{ matrix.target }}"
          if docker buildx imagetools inspect "$published_base" >/dev/null 2>&1; then
            docker pull "$published_base"
          else
            docker tag "$local_base" "$published_base"
            docker push "$published_base"
          fi
          base_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$published_base")"
          base_digest="${base_digest##*@}"
          [[ "$base_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          bun run runtime:artifact:build --engine docker --target "${{ matrix.target }}" --out "build/candidate/${{ matrix.target }}"
          artifact="build/candidate/${{ matrix.target }}/clarvis-kernel-${{ matrix.target }}.tar.gz"
          bun run runtime:qualify --engine docker --base "$published_base" --artifact "$artifact" --report "build/candidate/${{ matrix.target }}/qualification-docker-${{ matrix.target }}.json"
          docker save "$published_base" | podman load
          bun run runtime:qualify --engine podman --base "$published_base" --artifact "$artifact" --report "build/candidate/${{ matrix.target }}/qualification-podman-${{ matrix.target }}.json"
          artifact_sha="$(cut -d' ' -f1 "$artifact.sha256")"
          artifact_size="$(stat -c %s "$artifact")"
          BASE_IMAGE="$BASE_REPOSITORY" BASE_DIGEST="$base_digest" ARTIFACT_SHA="$artifact_sha" ARTIFACT_SIZE="$artifact_size" TARGET="${{ matrix.target }}" bun -e 'const target=process.env.TARGET; await Bun.write("build/candidate/"+target+"/target.json", JSON.stringify({base:{image:process.env.BASE_IMAGE,digest:process.env.BASE_DIGEST,abi:"clarvis-linux-glibc-v1"},artifact:{asset:"clarvis-kernel-"+target+".tar.gz",sha256:process.env.ARTIFACT_SHA,size:Number(process.env.ARTIFACT_SIZE)},kernel_wire_version:10,broker_version:1,channel_version:1},null,2)+"\n")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.target }}
          path: build/candidate/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish qualified source candidate
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-*
          path: build/candidate
      - name: assemble closed runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"; VERSION="${VERSION%%-rc.*}"
          VERSION="$VERSION" bun -e 'const x=await Bun.file("build/candidate/candidate-linux-x64/target.json").json(); const a=await Bun.file("build/candidate/candidate-linux-arm64/target.json").json(); await Bun.write("build/candidate/runtime-input.json",JSON.stringify({schema_version:2,version:process.env.VERSION,source_revision:process.env.GITHUB_SHA,targets:{"linux-x64":x,"linux-arm64":a}},null,2)+"\n")'
          bun run tooling/runtime/release-manifest.ts build/candidate/runtime-input.json build/candidate/runtime-release.json
          find build/candidate -mindepth 2 -type f -exec mv {} build/candidate/ \;
          bun run tooling/release/candidate.ts manifest
      - name: attest Kernel archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: build/candidate/clarvis-kernel-*.tar.gz
      - name: publish source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run tooling/release/candidate.ts publish
