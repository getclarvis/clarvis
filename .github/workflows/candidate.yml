name: candidate source

on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish qualified source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run tooling/release/candidate.ts validate
      - run: bun run check:release
      - run: bun run tooling/release/candidate.ts manifest
      - name: publish source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run tooling/release/candidate.ts publish
