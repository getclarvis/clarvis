name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      tar-digest: ${{ steps.pack.outputs.tar-digest }}
      producer-attempt: ${{ steps.pack.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: install Linux sandbox build prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential
      - run: bun run build
      - run: bun run smoke
      - name: package verified Linux build
        id: pack
        run: bun run tooling/checks/ci-artifacts.ts pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: linux-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/ci/linux-build.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 2
      - name: record upload cost
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CI_BUILD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CI_BUILD_TAR_DIGEST: ${{ steps.pack.outputs.tar-digest }}
          CI_BUILD_PRODUCER_ATTEMPT: ${{ steps.pack.outputs.producer-attempt }}
        run: bun run tooling/checks/ci-artifacts.ts uploaded

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run typecheck

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run lint:eslint

  knip:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run knip

  checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run format:check
      - run: bun run lint:intent
      - name: serialized prompt cache contracts (no credentials)
        run: bun run test:cache

  coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - name: install Linux sandbox helper for native coverage canaries
        run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential
      - name: generate native and worker assets outside the shared dist archive
        run: bun --filter @clarvis/sandbox build:assets && bun --filter @clarvis/tools build:assets
      - name: sequential workspace coverage with classified code retry
        run: bash tooling/ci/retry-code-coverage.sh

  linux:
    name: linux
    needs: [build, typecheck, lint, knip, checks, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every Linux gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e -s '
            length == 1 and (.[0] |
            type == "object" and
            (keys == ["build", "checks", "coverage", "knip", "lint", "typecheck"]) and
            all(.[]; type == "object" and has("result") and .result == "success"))
          ' <<< "$NEEDS_JSON"

  sandbox-macos-intel:
    name: sandbox native (macos intel)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun --filter @clarvis/sandbox test:native
      - run: bun --filter @clarvis/tools test:native

  # The stable required context also gates native Intel evidence.
  keyboard-macos:
    # Both permanent-branch rulesets require this exact status context. Keep the stable public
    # name when extending the job with additional macOS-specific canaries.
    name: keyboard policy (macos)
    needs: [sandbox-macos-intel]
    if: ${{ always() }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: require Intel sandbox canaries
        shell: bash
        env:
          INTEL_RESULT: ${{ needs.sandbox-macos-intel.result }}
        run: test "$INTEL_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - run: bun --filter @clarvis/sandbox test:native
      - run: bun --filter @clarvis/tools test:native
      - run: bun --filter @clarvis/tools test
      - run: bun test packages/code/tests/unit/keyboard-profile.test.ts packages/code/tests/unit/keyspec.test.ts packages/code/tests/unit/active-actions.test.ts
