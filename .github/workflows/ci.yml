name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      tar-digest: ${{ steps.pack.outputs.tar-digest }}
      producer-attempt: ${{ steps.pack.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - run: bun run build
      - run: bun run smoke
      - name: package verified Linux build
        id: pack
        run: bun run tooling/checks/ci-artifacts.ts pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: linux-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/ci/linux-build.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 2
      - name: record upload cost
        env:
          CI_BUILD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CI_BUILD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CI_BUILD_TAR_DIGEST: ${{ steps.pack.outputs.tar-digest }}
          CI_BUILD_PRODUCER_ATTEMPT: ${{ steps.pack.outputs.producer-attempt }}
        run: bun run tooling/checks/ci-artifacts.ts uploaded

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run typecheck

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run lint:eslint

  knip:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run knip

  checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - run: bun run format:check
      - run: bun run lint:intent
      - name: serialized prompt cache contracts (no credentials)
        run: bun run test:cache

  coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      CI_BUILD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
      CI_BUILD_TAR_DIGEST: ${{ needs.build.outputs.tar-digest }}
      CI_BUILD_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - name: install frozen dependencies
        run: time bun install --frozen-lockfile
      - name: validate producer outputs before download
        run: bun run tooling/checks/ci-artifacts.ts producer
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: coverage/ci/incoming
          merge-multiple: true
          digest-mismatch: error
      - name: verify and restore shared build
        run: bun run tooling/checks/ci-artifacts.ts restore
      - name: install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles bubblewrap ripgrep
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-user --ro-bind / / -- /bin/true
          bwrap --version
          rg --version
      - name: sequential workspace coverage with classified code retry
        env:
          CLARVIS_NATIVE_SANDBOX_CANARY: "1"
        run: bash tooling/ci/retry-code-coverage.sh

  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --file packages/server/Dockerfile --tag clarvis-server:ci .

  linux:
    name: linux
    needs: [build, typecheck, lint, knip, checks, coverage, server-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every Linux gate
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e -s '
            length == 1 and (.[0] |
            type == "object" and
            (keys == ["build", "checks", "coverage", "knip", "lint", "server-image", "typecheck"]) and
            all(.[]; type == "object" and has("result") and .result == "success"))
          ' <<< "$NEEDS_JSON"

  # Scoped to @clarvis/tools, @clarvis/paths and @clarvis/plan, which is where
  # the platform-specific code lives. All three resolve to source under Bun
  # through their exports map, so this needs no prior build of their siblings.
  #
  # `paths` is here because it owns `which.ts` — a `PATH`/`PATHEXT` resolver
  # whose whole reason to exist is Windows, and whose test asserts Windows
  # behaviour from a POSIX host. It arrived from `@clarvis/tools`, which this job
  # already covered; leaving it out would have silently dropped that coverage.
  #
  # `plan` is here because `file-repository.ts`'s `fsyncDir` has a real win32
  # branch (a directory-handle fsync Windows will not do, so a failure there is
  # swallowed rather than propagated) that was untested on either platform
  # before it, plus mode-bit and symlink assertions that only hold with
  # `modeBitsEnforced`/`canLinkDirectories` guarding them here the same way
  # `packages/paths/tests/integration/ensure.test.ts` already does.
  # `memory` owns a file-backed tree with Windows-relevant locking, bounded I/O,
  # and path behavior. Mode-bit assertions and the file-symlink security case
  # use named capability predicates so the rest of each test still runs.
  #
  # `code` contributes only its platform-independent keyboard-policy tests here;
  # the renderer suite remains on Linux, where its PTY harness is supported.
  # `kernel`, `loop`, `trace`, `mcp-client` and `supervision` are deliberately
  # absent because they either have no Windows surface or require a broader job.
  windows:
    name: tools, paths, plan, memory, keyboard policy (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      # ripgrep is not preinstalled on the windows-latest image; @clarvis/tools'
      # grep-parity suite (TEST-01) requires it whenever CI=true.
      #
      # This was `choco install ripgrep -y --no-progress`, and it must not go
      # back to being that. On 2026-08-04 community.chocolatey.org answered its
      # package feed with a 504, choco printed `Chocolatey installed 0/0
      # packages` - and exited 0. The step went green, the job went red three
      # minutes later inside a `bun test` assertion, and the only visible symptom
      # was TEST-01 failing as though @clarvis/tools were broken. An install step
      # that can report success over a no-op moves the diagnosis to the wrong
      # package.
      #
      # Fetching the pinned release instead depends only on github.com, which
      # this job already cannot run without, verifies the bytes against the
      # checksum published beside the asset, and proves the binary runs before
      # any test is allowed to depend on it.
      - name: install ripgrep
        shell: pwsh
        run: |
          $version = "15.2.0"
          $sha256 = "71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5"
          $name = "ripgrep-$version-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "ripgrep checksum mismatch: got $actual, want $sha256" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $dir = Join-Path $env:RUNNER_TEMP $name
          # A GITHUB_PATH entry only reaches the *next* step, so this run has to
          # name the executable outright to verify it.
          & (Join-Path $dir "rg.exe") --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: bun install --frozen-lockfile
      - run: bun --filter @clarvis/paths test
      - run: bun --filter @clarvis/tools test
      - run: bun --filter @clarvis/plan test
      - run: bun --filter @clarvis/memory test
      - run: bun test packages/code/tests/unit/keyboard-profile.test.ts packages/code/tests/unit/keyspec.test.ts packages/code/tests/unit/active-actions.test.ts

  # Darwin owns a real sandbox surface in addition to modifier naming. The
  # @clarvis/tools suite runs a Seatbelt canary against actual host files and a
  # loopback listener; the keyboard tests retain the platform policy coverage.
  sandbox-macos:
    # Both permanent-branch rulesets require this exact status context. Keep the stable public
    # name when extending the job with additional macOS-specific canaries.
    name: keyboard policy (macos)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - run: brew install ripgrep && rg --version
      - run: bun install --frozen-lockfile
      - run: CLARVIS_NATIVE_SANDBOX_CANARY=1 bun --filter @clarvis/tools test
      - run: CLARVIS_NATIVE_SANDBOX_CANARY=1 bun test packages/kernel/tests/integration/sandbox-policy.test.ts
      - run: bun test packages/code/tests/unit/keyboard-profile.test.ts packages/code/tests/unit/keyspec.test.ts packages/code/tests/unit/active-actions.test.ts
