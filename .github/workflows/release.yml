name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: record Bun runtime
        run: bun --version && bun --revision
      - run: bun install --frozen-lockfile
      - name: verify release identity
        run: bun run check:release
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - run: bun --filter @clarvis/code build:install
      - run: bun run release:package
      - run: bun run release:smoke
      - run: bun run release:install-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: build/release/clarvis-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish draft, attest, then activate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: assemble and verify release set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/release -maxdepth 1 -name 'clarvis-*.tar.gz' -type f | wc -l)" -eq 6
          test "$(find build/release -maxdepth 1 -name 'clarvis-*.tar.gz.sha256' -type f | wc -l)" -eq 6
          sed -n 'p' build/release/*.tar.gz.sha256 | sort -k2 > build/release/SHA256SUMS
          (cd build/release && sha256sum --check SHA256SUMS)
          cp install.sh install.ps1 LICENSE THIRD_PARTY_NOTICES.md build/release/
          cp third-party/bun/LICENSE.md build/release/BUN-LICENSE.md
          cp third-party/models.dev/LICENSE build/release/MODELS-DEV-LICENSE
          cp third-party/vercel-ai-sdk/LICENSE build/release/VERCEL-AI-SDK-LICENSE
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            build/release/clarvis-*.tar.gz
            build/release/SHA256SUMS
      - name: create a draft release with every verified asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --verify-tag --draft --generate-notes "${prerelease[@]}"
      - name: publish only after upload and attestation succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
